# Carte pour le tableau de bord Home Assistant :
# Modifier le tableau de bord › + Ajouter une carte › tout en bas « Manuel » › colle ce texte.
type: markdown
title: Tickets Maison
content: |
  {%- set tickets = state_attr('sensor.tickets_maison_ouverts', 'tickets') or [] -%}
  {%- set dots = {'sent': '🟣', 'inProgress': '🟠', 'waitingUser': '🟡'} -%}
  {%- set labels = {'sent': 'Envoyé', 'inProgress': 'En cours', 'waitingUser': 'En attente de réponse'} -%}
  {%- if tickets | count == 0 %}
  ✅ Aucun ticket en cours
  {%- else %}
  | Problème | Statut |
  |:---|:---|
  {%- for t in tickets %}
  | {{ t.title }}{{ ' ⚠️' if t.priority == 'urgent' else '' }} | {{ dots.get(t.status, '⚪') }} {{ labels.get(t.status, t.status) }} |
  {%- endfor %}
  {%- endif %}
